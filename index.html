<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>CB 12 Weeks Program</title>
<style>
:root{
  --bg:#0b0c0f; --panel:#15171c; --panel2:#1b1e24; --line:#252932; --line2:#333947;
  --tx:#f2f4f8; --mut:#8d939e; --dim:#5d6470;
  --acc:#ff6a2b; --acc2:#ffb347; --ok:#3ddc84; --bad:#ff5f56;
  --disp:"Bahnschrift","Bahnschrift SemiCondensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 420px at 50% -8%, rgba(255,106,43,.13), transparent 62%),
    radial-gradient(700px 380px at 100% 4%, rgba(255,179,71,.07), transparent 60%),
    var(--bg);
  color:var(--tx);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:96px;
  min-height:100vh;
}
header{
  position:sticky; top:0; z-index:20;
  background:rgba(11,12,15,.82);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid rgba(255,255,255,.055);
  padding:12px 18px; display:flex; align-items:center; gap:12px;
}
.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--disp); font-weight:700; font-size:13px;
  letter-spacing:.16em; text-transform:uppercase; white-space:nowrap;
}
.brand .dot{
  width:8px; height:8px; border-radius:50%;
  background:linear-gradient(135deg,var(--acc2),var(--acc));
  box-shadow:0 0 10px rgba(255,106,43,.8);
}
.weekrail{display:flex; gap:3px; margin-left:auto; align-items:center}
.weekrail i{display:block; width:4px; height:14px; border-radius:2px; background:#232833}
.weekrail i.past{background:var(--dim)}
.weekrail i.on{background:linear-gradient(180deg,var(--acc2),var(--acc)); box-shadow:0 0 8px rgba(255,106,43,.7)}
.wklbl{font-family:var(--mono); font-size:10px; color:var(--mut); letter-spacing:.04em; margin-left:7px}
main{max-width:560px; margin:0 auto; padding:16px 18px 24px}
h2{
  font-family:var(--disp); font-size:12px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--dim); margin:26px 0 10px; font-weight:600;
}
h2:first-child{margin-top:4px}
.card{
  background:linear-gradient(180deg,#181b21,#131519);
  border:1px solid var(--line);
  border-radius:20px;
  padding:15px 16px; margin-bottom:11px;
  box-shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 12px 28px rgba(0,0,0,.34);
}
.row{display:flex; align-items:center; gap:10px}
.sp{flex:1}
.mut{color:var(--mut)}
.sm{font-size:12px}
.xs{font-size:11px}
.tiny{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
b,strong{font-weight:650}

/* hero */
.hero{display:flex; align-items:center; gap:14px; padding:6px 2px 18px}
.hero-l{min-width:0}
.kick{
  font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--acc); margin-bottom:5px;
}
.hero h2.big{
  font-family:var(--disp); font-size:44px; line-height:.88; font-weight:700;
  text-transform:uppercase; letter-spacing:.01em; margin:0;
  background:linear-gradient(180deg,#ffffff,#b9bec8);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero .sub{font-size:12px; color:var(--mut); margin-top:6px; font-family:var(--mono)}
.hero-r{margin-left:auto; text-align:center; flex:0 0 auto}
.ring{filter:drop-shadow(0 0 9px rgba(255,106,43,.35))}
.ringtxt{font-family:var(--disp); font-size:19px; font-weight:700; fill:var(--tx)}
.ringlab{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-top:2px}

/* exercise cards */
.excard{position:relative; padding-left:18px; border-radius:18px}
.excard:before{
  content:''; position:absolute; left:0; top:15px; bottom:15px; width:3px;
  border-radius:0 3px 3px 0; background:var(--pcol,#2b3040);
}
.excard.done{box-shadow:0 0 0 1px rgba(61,220,132,.28), 0 12px 28px rgba(0,0,0,.34)}
.exnum{
  font-family:var(--mono); font-size:10px; color:var(--dim);
  width:18px; flex:0 0 auto; letter-spacing:.02em;
}
.name{font-weight:600; font-size:15px; letter-spacing:-.01em}
.settag{font-family:var(--mono); font-size:11px; color:var(--mut); font-variant-numeric:tabular-nums; white-space:nowrap}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}

button{
  font:inherit; color:var(--tx); background:var(--panel2); border:1px solid var(--line);
  border-radius:12px; padding:9px 12px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
}
button:active{transform:scale(.97)}
button.pri{
  background:linear-gradient(135deg,var(--acc2),var(--acc));
  border:0; color:#170a04; font-weight:800; font-size:12.5px;
  letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
  padding:13px 18px; border-radius:13px;
  box-shadow:0 8px 22px rgba(255,90,31,.36), 0 1px 0 rgba(255,255,255,.3) inset;
}
button.btnlog{
  width:100%; margin-top:11px; padding:11px; border-radius:12px; white-space:nowrap;
  background:rgba(255,255,255,.035); border:1px solid rgba(255,106,43,.38);
  color:#ff9d70; font-size:11.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  box-shadow:none;
}
button.btnlog:active{background:rgba(255,106,43,.20); color:#fff; border-color:rgba(255,106,43,.6)}
button.btnlog.done{background:rgba(61,220,132,.06); border-color:rgba(61,220,132,.28); color:#8fe3b3}
button.ghost{background:transparent}
button.sm{padding:6px 10px; font-size:12.5px; border-radius:9px}
button.icon{
  padding:0; width:38px; height:38px; border-radius:11px;
  font-size:17px; line-height:1; color:var(--mut);
  display:inline-flex; align-items:center; justify-content:center;
  background:#1a1d23;
}
button.icon:active{background:#23272f; color:var(--tx)}
button.wide{width:100%}
button:disabled{opacity:.45}
.wbox{display:inline-flex; align-items:baseline; gap:3px; min-width:0}
.winput{
  width:52px; padding:0; text-align:center;
  font-family:var(--disp); font-size:24px; font-weight:700; letter-spacing:-.01em;
  font-variant-numeric:tabular-nums; color:var(--tx);
  background:transparent; border:0; border-bottom:1px dashed rgba(255,255,255,.14); border-radius:0;
}
.repin{width:38px}
.winput::-webkit-outer-spin-button,.winput::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.winput:focus{outline:none; border-bottom-color:var(--acc); background:rgba(255,106,43,.1); border-radius:6px 6px 0 0}
.winput::placeholder{color:var(--acc); opacity:.85}
input,select{
  font:inherit; color:var(--tx); background:#111318; border:1px solid var(--line);
  border-radius:11px; padding:10px 12px; width:100%;
}
input:focus,select:focus{outline:0; border-color:var(--acc); box-shadow:0 0 0 3px rgba(255,106,43,.16)}
label{display:block; font-size:9.5px; color:var(--dim); margin-bottom:5px; letter-spacing:.14em; text-transform:uppercase}
.stacklog{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.chip{
  font-family:var(--mono); font-size:11px; padding:5px 9px; border-radius:9px;
  background:#1d222b; border:1px solid #2b3240; color:#cfd6e2;
  font-variant-numeric:tabular-nums; display:inline-flex; align-items:center; gap:7px;
}
.chip .x{color:var(--dim); font-size:14px; padding:0 1px; cursor:pointer}
.banner{
  background:linear-gradient(135deg,rgba(255,106,43,.14),rgba(255,106,43,.05));
  border:1px solid rgba(255,106,43,.34); color:#ffc7a8;
  padding:11px 13px; border-radius:14px; font-size:12.5px; margin-bottom:10px;
}
.banner.ok{
  background:linear-gradient(135deg,rgba(61,220,132,.13),rgba(61,220,132,.04));
  border-color:rgba(61,220,132,.3); color:#a8ecc4;
}
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:rgba(13,14,18,.92);
  backdrop-filter:blur(18px) saturate(1.3);
  border-top:1px solid rgba(255,255,255,.06);
  display:grid; grid-template-columns:repeat(5,1fr);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
nav button{
  background:none; border:0; color:var(--dim); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 2px; display:flex; flex-direction:column;
  align-items:center; gap:5px; border-radius:12px; font-weight:600;
}
nav button .ic{width:21px; height:21px; display:block}
nav button.on{color:var(--acc)}
nav button.on .ic{filter:drop-shadow(0 0 7px rgba(255,106,43,.55))}
svg.chart{width:100%; height:auto; color:var(--acc); display:block; overflow:visible}
.chartlab{display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--dim); margin-top:6px}
.dayswitch{display:flex; gap:7px; overflow-x:auto; padding:2px 0 6px; margin-bottom:12px; scrollbar-width:none}
.dayswitch::-webkit-scrollbar{display:none}
.dayswitch button{
  white-space:nowrap; font-family:var(--disp); font-size:13px; letter-spacing:.04em;
  padding:8px 15px; border-radius:999px; background:#14161b; color:var(--mut);
  border:1px solid var(--line); text-transform:uppercase; font-weight:600;
}
.dayswitch button.on{
  background:linear-gradient(135deg,var(--acc2),var(--acc)); color:#170a04; border-color:transparent;
  box-shadow:0 6px 18px rgba(255,90,31,.32); font-weight:800;
}
#restbar{
  position:fixed; left:14px; right:14px; bottom:86px; z-index:40;
  display:none; align-items:center; gap:12px;
  background:linear-gradient(180deg,#1d2128,#15181e);
  border:1px solid #2e3441; border-radius:16px;
  padding:11px 14px;
  font-family:var(--mono); font-size:20px; font-variant-numeric:tabular-nums;
  box-shadow:0 14px 34px rgba(0,0,0,.55);
}
#restbar.on{display:flex}
#restbar .rb{flex:1; min-width:0}
#restbar .rlab{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
#restbar .rline{height:3px; background:#252a33; border-radius:3px; overflow:hidden; margin-top:7px}
#restbar .rline i{display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width .4s linear}
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:140px; z-index:50;
  background:#1d2128; border:1px solid #2e3441; padding:10px 16px; border-radius:12px;
  font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}
#toast.on{opacity:1}
.pbar{height:5px; background:#20242c; border-radius:6px; overflow:hidden; margin-top:9px}
.pbar i{display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:6px}
ul.clean{list-style:none; padding:0; margin:0}
ul.clean li{padding:9px 0; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center}
ul.clean li:last-child{border-bottom:0}
.kv{display:flex; justify-content:space-between; padding:6px 0; font-size:13px}
.kv span:first-child{color:var(--mut)}
.hr{height:1px; background:var(--line); margin:13px 0}
.seg{display:flex; gap:7px; margin-bottom:12px}
.seg button{flex:1; font-size:12px; padding:8px}
.seg button.on{
  background:linear-gradient(135deg,var(--acc2),var(--acc)); color:#170a04;
  border-color:transparent; font-weight:800;
}
.route{display:block; width:100%; text-align:left; margin-bottom:8px}
.route .top{display:flex; align-items:baseline; gap:8px}
.route .top .t{font-weight:650}
.route .top .q{margin-left:auto; color:var(--mut); font-size:12px; font-variant-numeric:tabular-nums}
.oktx{color:var(--ok)} .badtx{color:var(--bad)}
.bignum{font-family:var(--disp); font-size:30px; line-height:1; font-weight:700; letter-spacing:-.01em}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>CB 12 Weeks</div>
  <div class="weekrail" id="wkrail"></div>
  <span class="wklbl" id="wklbl">W1/12</span>
</header>
<main id="view"></main>
<div id="restbar">
  <div class="rb"><div class="rlab">Rest</div><div class="rline"><i id="restfill" style="width:100%"></i></div></div>
  <span id="restnum">0:00</span>
  <button class="sm ghost" data-act="restskip">Skip</button>
</div>
<div id="toast"></div>
<nav>
  <button data-tab="today" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><span>Today</span></button>
  <button data-tab="progress"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V11M10 20V4M16 20v-6M21 20H2"/></svg><span>Progress</span></button>
  <button data-tab="plan"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Plan</span></button>
  <button data-tab="body"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="7" r="3.2"/><path d="M5 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg><span>Body</span></button>
  <button data-tab="setup"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span>Setup</span></button>
</nav>
<script>
'use strict';

/* ============================================================
   CB 12 Weeks Program: local-only tracker
   Storage: localStorage, single JSON blob, exportable
   ============================================================ */

var LS = 'liftlens.v1';
var MUS = {chest:'Chest',front_delt:'Front delt',side_delt:'Side delt',rear_delt:'Rear delt',
  triceps:'Triceps',biceps:'Biceps',forearms:'Forearms',lats:'Lats',upper_back:'Upper back',
  traps:'Traps',quads:'Quads',hams:'Hamstrings',glutes:'Glutes',calves:'Calves',abs:'Abs',
  lower_back:'Lower back'};

/* ---------- exercise library ---------- */
/* load: barbell | perhand | stack | bodyweight. inc = default increment in lb */
var EX = [
 {id:'pecdeck',  n:'Machine pec deck',              pat:'push_h', pri:['chest'],                 sec:['front_delt'],            load:'stack', inc:5,  grp:'fly'},
 {id:'bbbench',  n:'Barbell bench press',           pat:'push_h', pri:['chest'],                 sec:['triceps','front_delt'],  load:'barbell', inc:5, grp:'hpress', main:1, seed:115},

 {id:'dips',     n:'Dips',                          pat:'push_v', pri:['chest','triceps'],       sec:['front_delt'],            load:'bodyweight', inc:5, grp:'dip'},
 {id:'dbpress',  n:'Seated dumbbell shoulder press',pat:'push_v', pri:['front_delt'],            sec:['side_delt','triceps'],   load:'perhand', inc:5, grp:'spress', seed:45},
 {id:'machpress',n:'Machine shoulder press',        pat:'push_v', pri:['front_delt'],            sec:['side_delt','triceps'],   load:'stack', inc:5,  grp:'spress'},

 {id:'revpecdeck',n:'Reverse pec deck',             pat:'iso',    pri:['rear_delt'],             sec:['upper_back'],            load:'stack', inc:5,  grp:'reardelt', seed:110},
 {id:'facepull', n:'Face pull',                     pat:'pull_h', pri:['rear_delt','upper_back'],sec:['traps'],                 load:'stack', inc:5,  grp:'reardelt', seed:66},
 {id:'pushdown', n:'Rope triceps pushdown',         pat:'iso',    pri:['triceps'],               sec:[],                        load:'stack', inc:5,  grp:'tripush'},
 {id:'ohtriceps',n:'Overhead cable triceps extension',pat:'iso',  pri:['triceps'],               sec:[],                        load:'stack', inc:5,  grp:'tripush'},
 {id:'skull',    n:'Decline EZ-bar skull crusher',  pat:'iso',    pri:['triceps'],               sec:[],                        load:'barbell', inc:5, grp:'tripush'},
 {id:'kickback', n:'Triceps kickback',              pat:'iso',    pri:['triceps'],               sec:[],                        load:'perhand', inc:5, grp:'tripush', seed:15},
 {id:'pullup',   n:'Neutral-grip pull-up',          pat:'pull_v', pri:['lats'],                  sec:['biceps','upper_back'],   load:'bodyweight', inc:5, grp:'vpull'},
 {id:'bentrow',  n:'Barbell bent-over row',         pat:'pull_h', pri:['upper_back','lats'],     sec:['biceps','lower_back'],   load:'barbell', inc:5, grp:'hrow', main:1, seed:65},

 {id:'latpull',  n:'Lat pulldown',                  pat:'pull_v', pri:['lats'],                  sec:['biceps'],                load:'stack', inc:5,  grp:'vpull', seed:165},
 {id:'btpull',   n:'Behind-the-back lat pulldown',  pat:'pull_v', pri:['lats'],                  sec:['biceps'],                load:'stack', inc:5,  grp:'vpull', seed:165},
 {id:'onearmlat',n:'One-arm cable lat pulldown',    pat:'pull_v', pri:['lats'],                  sec:['biceps'],                load:'stack', inc:5,  grp:'vpull', seed:66},
 {id:'meadowrow',n:'Meadow row',                    pat:'pull_h', pri:['upper_back','lats'],     sec:['biceps'],                load:'barbell', inc:5, grp:'hrow', seed:45},
 {id:'cablerow', n:'Seated cable row',              pat:'pull_h', pri:['upper_back','lats'],     sec:['biceps'],                load:'stack', inc:5,  grp:'hrow', seed:165},
 {id:'ezcurl',   n:'EZ-bar curl',                   pat:'iso',    pri:['biceps'],                sec:['forearms'],              load:'barbell', inc:5, grp:'curl'},
 {id:'hammercurl',n:'Hammer curl',                  pat:'iso',    pri:['biceps','forearms'],     sec:[],                        load:'perhand', inc:5, grp:'curl'},
 {id:'preacher', n:'Barbell preacher curl',         pat:'iso',    pri:['biceps'],                sec:[],                        load:'barbell', inc:5, grp:'curl'},
 {id:'inclinecurl',n:'Incline dumbbell curl',       pat:'iso',    pri:['biceps'],                sec:[],                        load:'perhand', inc:5, grp:'curl'},
 {id:'bayesian', n:'Bayesian cable curl',           pat:'iso',    pri:['biceps'],                sec:[],                        load:'stack', inc:5,  grp:'curl'},
 {id:'revcurl',  n:'Reverse EZ-bar curl',           pat:'iso',    pri:['forearms'],              sec:['biceps'],                load:'barbell', inc:5, grp:'curl'},
 {id:'shrug',    n:'Dumbbell or machine shrug',     pat:'iso',    pri:['traps'],                 sec:['upper_back'],            load:'perhand', inc:5, grp:'shrug'},
 {id:'carry',    n:'Farmer carry (seconds)',        pat:'iso',    pri:['forearms','traps'],      sec:['abs'],                   load:'perhand', inc:10, grp:'carry'},
 {id:'squat',    n:'Back squat',                    pat:'squat',  pri:['quads','glutes'],        sec:['hams','lower_back'],     load:'barbell', inc:10, grp:'squat', main:1, seed:115},
 {id:'frontsq',  n:'Front squat',                   pat:'squat',  pri:['quads'],                 sec:['glutes','abs'],          load:'barbell', inc:10, grp:'squat', main:1, seed:65},
 {id:'hack',     n:'Hack squat',                    pat:'squat',  pri:['quads'],                 sec:['glutes'],                load:'stack', inc:10, grp:'squat'},

/* ---------- state ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return (n<10?'0':'')+n; }
function defState(){
  return {start: todayStr(), sessions:[], sets:[], body:[], swaps:[], decisions:[], notes:[],
          settings:{inc:{}, unit:'lb', bwStart:null}};
}
var S;
try{ S = JSON.parse(localStorage.getItem(LS)) || defState(); }catch(e){ S = defState(); }
if(!S.settings){ S.settings={inc:{},unit:'lb',bwStart:null}; }

/* ---------- sync config (kept apart from the log so an export never carries keys) ---------- */
var SKEY = 'liftlens.sync.v1';
var SYNC = (function(){ try{ return JSON.parse(localStorage.getItem(SKEY))||{}; }catch(e){ return {}; } })();
function saveSync(){ try{ localStorage.setItem(SKEY, JSON.stringify(SYNC)); }catch(e){} }
function syncConfigured(){ return !!(SYNC.url && SYNC.key && SYNC.token); }
function genToken(){
  var a = new Uint8Array(24);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(var i=0;i<a.length;i++) a[i]=Math.floor(Math.random()*256);
  return Array.prototype.map.call(a, function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
}
function sbUrl(fn){ return SYNC.url.replace(/\/+$/,'') + '/rest/v1/rpc/' + fn; }
function sbCall(fn, body){
  return fetch(sbUrl(fn), {
    method:'POST',
    headers:{ 'apikey':SYNC.key, 'Authorization':'Bearer '+SYNC.key, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){ throw new Error(r.status+' '+t.slice(0,120)); });
    }
    return r.json();
  });
}
function syncPayload(){
  return {v:1, updatedAt:Date.now(), start:S.start, sessions:S.sessions, sets:S.sets,
          body:S.body, swaps:S.swaps, decisions:S.decisions, deleted:S.deleted};
}
/* union both sides by id, newest record wins, then drop anything tombstoned */
function mergeRemote(r){
  if(!r) return false;
  var changed = false;
  var ds  = {}, dss = {};
  ((S.deleted&&S.deleted.sets)||[]).forEach(function(id){ ds[id]=1; });
  ((r.deleted&&r.deleted.sets)||[]).forEach(function(id){ ds[id]=1; changed=true; });
  ((S.deleted&&S.deleted.sessions)||[]).forEach(function(id){ dss[id]=1; });
  ((r.deleted&&r.deleted.sessions)||[]).forEach(function(id){ dss[id]=1; changed=true; });
  S.deleted = {sets:Object.keys(ds), sessions:Object.keys(dss)};

  var sm = {};
  S.sessions.forEach(function(x){ sm[x.id]=x; });
  (r.sessions||[]).forEach(function(x){
    if(!sm[x.id] || (x.ts||0) > (sm[x.id].ts||0)){ sm[x.id]=x; changed=true; }
  });
  S.sessions = Object.keys(sm).map(function(k){ return sm[k]; });

  var st = {};
  S.sets.forEach(function(x){ st[x.id]=x; });
  (r.sets||[]).forEach(function(x){
    if(!st[x.id] || (x.ts||0) > (st[x.id].ts||0)){ st[x.id]=x; changed=true; }
  });
  S.sets = Object.keys(st).map(function(k){ return st[k]; });

  var bm = {};
  S.body.forEach(function(x){ bm[x.date]=x; });
  (r.body||[]).forEach(function(x){
    if(!bm[x.date] || (x.ts||0) > (bm[x.date].ts||0)){ bm[x.date]=x; changed=true; }
  });
  S.body = Object.keys(bm).map(function(k){ return bm[k]; }).sort(function(a,b){ return a.date<b.date?-1:1; });

  if(r.start && (!S.start || r.start < S.start)){ S.start = r.start; }

  S.sets = S.sets.filter(function(x){ return !ds[x.id]; });
  S.sessions = S.sessions.filter(function(x){ return !dss[x.id]; });
  return changed;
}

var syncing = false, pushTimer = null;
function syncNow(manual){
  if(!syncConfigured()){ if(manual) toast('Add your Supabase details first'); return Promise.resolve(false); }
  if(syncing) return Promise.resolve(false);
  syncing = true;
  SYNC.status = 'Syncing';
  if(manual) render();
  return sbCall('pull_state', {p_token:SYNC.token})
    .then(function(remote){
      if(mergeRemote(remote)) save(true);
      return sbCall('push_state', {p_token:SYNC.token, p_payload:syncPayload()});
    })
    .then(function(){
      SYNC.lastSync = Date.now(); SYNC.status = 'ok'; saveSync(); syncing = false;
      if(manual) render();
      return true;
    })
    .catch(function(e){
      SYNC.status = 'error: ' + e.message; saveSync(); syncing = false;
      if(manual){ render(); toast('Sync failed'); }
      return false;
    });
}
function queuePush(){
  if(!syncConfigured()) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){ pushTimer = null; syncNow(false); }, 2500);
}
function syncStatusLine(){
  if(!syncConfigured()) return 'Not connected. The app works locally without this.';
  if(SYNC.status === 'ok' && SYNC.lastSync){
    var d = new Date(SYNC.lastSync);
    return 'Connected. Last sync ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '.';
  }
  if(SYNC.status && SYNC.status !== 'Syncing' && SYNC.status !== 'ok') return 'Connected. Last attempt failed.';
  return 'Connected, waiting for the first sync.';
}

function save(skipSync){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }
  catch(e){ toast('Could not save (storage full or blocked)'); }
  if(!skipSync) queuePush();
}

/* ---------- dates and weeks ---------- */
function weekNo(){
  var a = Date.parse(S.start+'T00:00:00');
  if(isNaN(a)) return 1;
  var days = Math.floor((Date.now()-a)/86400000);
  return Math.max(1, Math.min(12, Math.floor(days/7)+1));
}
function blockNo(w){ return w<=4?1:(w<=8?2:3); }
var BLOCKS = ['Normalize','Intensify','Density'];
function blockName(w){ return BLOCKS[blockNo(w)-1]; }
function sessionFor(day){
  var t = todayStr();
  var s = S.sessions.filter(function(x){ return x.date===t && x.day===day; })[0];
  if(!s){ s = {id:uid(), date:t, day:day, week:weekNo(), ts:Date.now()}; S.sessions.push(s); save(); }
  return s;
}
function nextDay(){
  if(!S.sessions.length) return 1;
  var last = S.sessions.slice().sort(function(a,b){ return a.ts-b.ts; }).pop();
  return (last.day % 6) + 1;
}
function setsFor(sid){ return S.sets.filter(function(x){ return x.sid===sid; }); }
function histFor(exId){
  return S.sets.filter(function(s){ return s.ex===exId && !s.warm; })
               .sort(function(a,b){ return a.ts-b.ts; });
}
function lastGroup(exId){
  var h=histFor(exId); if(!h.length) return null;
  var sid=h[h.length-1].sid;
  return h.filter(function(s){ return s.sid===sid; });
}

/* ---------- program resolution ---------- */
function templateFor(day, week){
  var t = PROG[day-1];
  var out = t.ex.map(function(e){
    var id = e.ex;
    if(week>=9 && e.v9) id = e.v9;
    else if(week>=5 && e.v5) id = e.v5;
    return {ex:id, sets:e.sets, lo:e.lo, hi:e.hi, rest:e.rest, rir:e.rir,
            warm:e.warm||0, secs:e.secs||0, orig:e.ex};
  });
  var d = DELOAD[week];
  if(d){ out = out.map(function(e){
      var n = Math.max(1, Math.round(e.sets*d.vol));
      return Object.assign({}, e, {sets:n, deload:true});
  }); }
  return {day:t.day, n:t.n, tag:t.tag, mins:t.mins, ex:out, deload:d||null};
}

/* ---------- engine ---------- */
function incFor(exId){
  var o = S.settings.inc[exId];
  return (typeof o === 'number' && o>0) ? o : EXM[exId].inc;
}
/* how large a jump we will allow before switching to a rep push */
function capFor(exId){
  var x = EXM[exId];
  if(!x) return 0.05;
  if(x.pat==='squat'||x.pat==='hinge'||x.pat==='lunge') return 0.10;
  return 0.05;
}
function e1rm(w, reps, rir){
  return w * (1 + ((reps + (rir||0)) / 30));
}
function suggest(e, week){
  var ex = EXM[e.ex];
  var d = DELOAD[week];
  var g = lastGroup(e.ex);
  if(!g){
    return {w: ex.seed || null, reps: e.lo, note: ex.seed ? 'Seeded from your sheet' : 'Set your starting load', first:true, rir:e.rir};
  }
  var top = Math.max.apply(null, g.map(function(s){ return s.weight; }));
  var work = g.filter(function(s){ return s.weight===top; });
  var minR = Math.min.apply(null, g.map(function(s){ return s.reps; }));
  var maxR = Math.max.apply(null, g.map(function(s){ return s.reps; }));
  var avRir = work.reduce(function(a,s){ return a+(s.rir||0); },0)/work.length;
  if(d){
    return {w: Math.round(top*d.load/5)*5, reps:e.lo, note:d.label+' load', rir:e.rir};
  }
  var inc = incFor(e.ex);
  if(e.secs){
    return {w: top, reps: (maxR>=e.hi ? Math.min(e.hi+5, maxR+5) : maxR),
            note: maxR>=e.hi ? 'Hold longer' : 'Add 5 seconds', rir:e.rir};
  }
  if(minR>=e.hi && avRir>=e.rir){
    if(inc/top > capFor(e.ex)){
      return {w: top, reps:e.hi+1, note:'Rep push, hold load', rir:e.rir};
    }
    return {w: top+inc, reps:e.lo, note:'+'+inc+' lb', rir:e.rir};
  }
  if(minR>=e.lo){
    return {w: top, reps: Math.min(e.hi, maxR+1), note:'Add a rep', rir:e.rir};
  }
  return {w: top, reps: Math.max(e.lo, maxR), note:'Repeat the load', rir:e.rir};
}
function stallCount(exId){
  var h = histFor(exId); if(h.length<4) return 0;
  var bySid = {}, order = [];
  h.forEach(function(s){
    if(!bySid[s.sid]){ bySid[s.sid]=[]; order.push(s.sid); }
    bySid[s.sid].push(s);
  });
  var c=0;
  for(var i=order.length-1; i>=1; i--){
    var a=bySid[order[i]], b=bySid[order[i-1]];
    var aw=Math.max.apply(null,a.map(function(s){return s.weight;}));
    var bw=Math.max.apply(null,b.map(function(s){return s.weight;}));
    var ar=Math.max.apply(null,a.map(function(s){return s.reps;}));
    var br=Math.max.apply(null,b.map(function(s){return s.reps;}));
    if(aw===bw && ar<=br) c++; else break;
  }
  return c;
}
function alerts(){
  var out=[];
  var w = weekNo();
  PROG.forEach(function(t){
    t.ex.forEach(function(e){
      if(stallCount(e.ex)>=3){
        out.push({kind:'swap', ex:e.ex, txt:'Swap '+EXM[e.ex].n+': flat for 3 sessions.'});
      }
    });
  });
  var mainsStalled = ['bbbench','squat','bentrow','rdl','frontsq','trapbar'].filter(function(id){ return stallCount(id)>=2; });
  if(mainsStalled.length>=2){
    out.push({kind:'deload', txt:'Two main lifts are flat ('+mainsStalled.map(function(i){return EXM[i].n;}).join(', ')+'). Take a deload week early.'});
  }
  if(w===8) out.push({kind:'info', txt:DELOAD[8].note});
  if(w===4) out.push({kind:'info', txt:DELOAD[4].note});
  if(w===12) out.push({kind:'info', txt:DELOAD[12].note});
  var bw = bodyTrend();
  if(bw && bw.slope!==null){
    if(bw.slope < -0.28) out.push({kind:'food', txt:'Losing '+Math.abs(bw.slope).toFixed(2)+' lb/week. If strength is flat, add 150 to 200 kcal.'});
    if(bw.slope > -0.04 && bw.slope < 0.1) out.push({kind:'food', txt:'Weight is flat over 2 weeks. If waist is flat too, cut 150 to 200 kcal.'});
  }
  return out;
}

/* ---------- body trend ---------- */
function bodyTrend(){
  var b = S.body.slice().sort(function(x,y){ return x.date<y.date?-1:1; });
  if(b.length<2) return null;
  var recent = b.slice(-8);
  var n=recent.length, sx=0, sy=0, sxy=0, sxx=0;
  recent.forEach(function(r,i){
    var x=i, y=r.weight;
    sx+=x; sy+=y; sxy+=x*y; sxx+=x*x;
  });
  var den = n*sxx - sx*sx;
  var slope = den ? (n*sxy - sx*sy)/den : 0;
  var span = (Date.parse(recent[n-1].date) - Date.parse(recent[0].date))/86400000;
  var perWeek = span>0 ? slope*(7/ (span/(n-1))) : 0;
  return {slope: isFinite(perWeek)? perWeek : 0, latest: recent[n-1].weight, n:n};
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function fmtW(e, w){
  if(w===null||w===undefined) return '?';
  var ex = EXM[e.ex];

function repTxt(e){
  if(e.secs) return e.sets+' x '+e.lo+' to '+e.hi+' sec';
  if(e.lo===e.hi) return e.sets+' x '+e.lo;
  return e.sets+' x '+e.lo+' to '+e.hi;
}
function lineChart(vals, opts){
  opts = opts||{};
  if(!vals || vals.length<2) return '<div class="mut sm" style="padding:10px 0">Log two sessions to see a trend.</div>';
  var w=320, h=opts.h||92, p=8, mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx===mn){ mx=mn+1; }
  function X(i){ return p + i*(w-2*p)/(vals.length-1); }
  function Y(v){ return h-p - ((v-mn)/(mx-mn))*(h-2*p); }
  var d = vals.map(function(v,i){ return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); }).join(' ');
  var area = d + ' L'+X(vals.length-1).toFixed(1)+' '+(h-p)+' L'+X(0).toFixed(1)+' '+(h-p)+' Z';
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<path d="'+area+'" fill="currentColor" opacity=".10" stroke="none"/>'+
    '<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(vals.length-1).toFixed(1)+'" cy="'+Y(vals[vals.length-1]).toFixed(1)+'" r="3.2" fill="currentColor"/>'+
    '</svg>';
}
function barChart(vals, labels, target){
  if(!vals.length) return '<div class="mut sm" style="padding:10px 0">No data yet.</div>';
  var w=320, h=84, gap=4, bw=(w-gap*(vals.length-1))/vals.length;
  var mx = Math.max(Math.max.apply(null,vals), target||0, 1);
  var out = '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  if(target){ var ty=h-6-(target/mx)*(h-14); out += '<line x1="0" y1="'+ty+'" x2="'+w+'" y2="'+ty+'" stroke="#4cc38a" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>'; }
  vals.forEach(function(v,i){
    var bh = Math.max(2,(v/mx)*(h-14));
    out += '<rect x="'+(i*(bw+gap)).toFixed(1)+'" y="'+(h-6-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="currentColor" opacity="'+(0.55+0.45*(v/mx)).toFixed(2)+'"/>';
  });
  out += '</svg>';
  if(labels) out += '<div class="chartlab"><span>'+esc(labels[0])+'</span><span>'+esc(labels[labels.length-1])+'</span></div>';
  return out;
}

function restTxt(s){ return s>=120 ? (s/60)+' min' : s+'s'; }
function patColor(p){
  if(!p) return 'var(--line2)';
  if(p.indexOf('push')===0) return 'var(--acc)';
  if(p.indexOf('pull')===0) return 'var(--acc2)';
  if(p==='squat'||p==='hinge'||p==='lunge') return '#9aa3b2';
  return 'var(--line2)';
}
function ringSVG(pct, size, center){
  var r = size/2 - 7;
  var c = 2*Math.PI*r;
  var p = Math.max(0, Math.min(100, pct||0));
  var off = c * (1 - p/100);
  var mid = size/2;
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+mid+'" cy="'+mid+'" r="'+r+'" fill="none" stroke="#242932" stroke-width="7"/>'+
    '<circle cx="'+mid+'" cy="'+mid+'" r="'+r+'" fill="none" stroke="var(--acc)" stroke-width="7" '+
      'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" '+
      'transform="rotate(-90 '+mid+' '+mid+')"/>'+
    '<text x="50%" y="50%" text-anchor="middle" dy=".36em" class="ringtxt">'+center+'</text>'+
  '</svg>';
}
function draft(e, sg){
  var d = DRAFT[e.ex];
  if(!d || !d.edited){
    DRAFT[e.ex] = {w: sg.w===null?(EXM[e.ex].seed||0):sg.w, reps: sg.reps, edited:false};
  }
  return DRAFT[e.ex];
}

function viewProgress(){
  var exs = {};
  S.sets.forEach(function(s){ if(!s.warm) exs[s.ex]=(exs[s.ex]||0)+1; });
  var ids = Object.keys(exs);
  if(!ids.length){
    return '<h2>Progress</h2><div class="card"><div class="sm mut">Nothing logged yet. Log a set on the Today tab and the charts fill in.</div></div>';
  }
  if(!PROGEX || !exs[PROGEX]) PROGEX = ids.sort(function(a,b){ return exs[b]-exs[a]; })[0];
  var h = '<h2>Lift trend</h2><div class="card">';
  h += '<select data-act="pickex">';
  ids.sort(function(a,b){ return EXM[a].n.localeCompare(EXM[b].n); }).forEach(function(id){
    h += '<option value="'+id+'"'+(id===PROGEX?' selected':'')+'>'+esc(EXM[id].n)+'</option>';
  });
  h += '</select>';
  var bySid={}, order=[];
  histFor(PROGEX).forEach(function(s){
    if(!bySid[s.sid]){ bySid[s.sid]=[]; order.push(s.sid); }
    bySid[s.sid].push(s);
  });
  var e1=[], vols=[];
  order.forEach(function(sid){
    var g=bySid[sid];
    var best=0;
    g.forEach(function(s){ best=Math.max(best, e1rm(s.weight, s.reps, s.rir)); });
    e1.push(best);
    vols.push(g.reduce(function(a,s){ return a+s.weight*s.reps; },0));
  });
  var top = order.length? bySid[order[order.length-1]] : [];
  var bestSet = top.length? top.reduce(function(a,b){ return e1rm(a.weight,a.reps,a.rir)>e1rm(b.weight,b.reps,b.rir)?a:b; }) : null;
  h += lineChart(e1);
  h += '<div class="row sm mut" style="margin-top:6px"><span>'+(order.length)+' sessions</span><div class="sp"></div>'+
       '<span>est 1RM now: <b style="color:var(--tx)">'+(e1.length?Math.round(e1[e1.length-1]):0)+' lb</b></span></div>';

  h += '</div>';

  h += '<h2>Weekly volume</h2><div class="card">';

    if(s.warm) return;
    var ses = S.sessions.filter(function(x){ return x.id===s.sid; })[0];
    if(!ses) return;
    var k = ses.week||1;
    wk[k] = (wk[k]||0) + s.weight*s.reps;
  });
  var keys = Object.keys(wk).map(Number).sort(function(a,b){ return a-b; });
  if(keys.length){
    h += barChart(keys.map(function(k){ return wk[k]; }), ['W'+keys[0], 'W'+keys[keys.length-1]]);
    h += '<div class="kv"><span>Total logged</span><span>'+(S.sets.filter(function(s){return !s.warm;}).length)+' sets</span></div>';
  } else { h += '<div class="sm mut">Log a session first.</div>'; }
  h += '</div>';

  h += '<h2>Weekly sets by muscle</h2><div class="card">';
  h += muscleVolume();
  h += '</div>';
  return h;

function muscleVolume(){
  var w = weekNo();
  var targets = {chest:18, quads:16, hams:12, glutes:10, lats:12, upper_back:14, side_delt:10,
    rear_delt:9, biceps:12, triceps:12, calves:10, abs:9, traps:5, forearms:4};
  var t = templateFor(1,w);
  var acc={};
  for(var d=1; d<=6; d++){
    templateFor(d,w).ex.forEach(function(e){
      var x = EXM[e.ex];
      if(!x) return;
      x.pri.forEach(function(m){ acc[m]=(acc[m]||0)+e.sets; });
      x.sec.forEach(function(m){ acc[m]=(acc[m]||0)+e.sets*0.5; });
    });
  }
  var keys = ['chest','upper_back','lats','quads','hams','glutes','side_delt','rear_delt','biceps','triceps','calves','abs'];
  var h='';
  keys.forEach(function(k){
    var v = Math.round(acc[k]||0), tgt = targets[k]||10;
    var pct = Math.min(100, Math.round(v/(tgt*1.5)*100));
    var over = v > tgt*1.35;
    h += '<div style="margin-bottom:9px"><div class="row sm"><span>'+MUS[k]+'</span><div class="sp"></div>'+
         '<span class="'+(over?'badtx':'mut')+'" style="font-variant-numeric:tabular-nums">'+v+' / '+tgt+'</span></div>'+
         '<div class="pbar"><i style="width:'+pct+'%;'+(over?'background:var(--bad)':'')+'"></i></div></div>';
  });
  return h;
}

  h += '<pre class="xs mut" style="white-space:pre-wrap;word-break:break-word;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;max-height:220px;overflow:auto">'+esc(SYNC_SQL)+'</pre>';
  h += '</details>';
  if(syncConfigured()) h += '<button class="wide ghost" data-act="syncdisconnect" style="margin-top:10px">Disconnect sync</button>';
  h += '</div>';

  h += '<h2>Data</h2><div class="card">';
  h += '<div class="kv"><span>Sessions</span><span>'+S.sessions.length+'</span></div>';
  h += '<div class="kv"><span>Sets</span><span>'+S.sets.length+'</span></div>';
  h += '<div class="kv"><span>Measurements</span><span>'+S.body.length+'</span></div>';
  h += '<div class="hr"></div>';
  h += '<div class="grid2"><button data-act="export">Export JSON</button>'+
       '<button data-act="import">Import JSON</button></div>';
  h += '<input id="impfile" type="file" accept="application/json" style="display:none">';
  h += '<button class="wide ghost" data-act="wipe" style="margin-top:10px;color:var(--bad)">Erase all data</button>';
  h += '</div>';

  h += '<h2>How the engine works</h2><div class="card sm" style="line-height:1.6">';
  h += 'Hit the top of the rep range on every set at or above the target RIR and your next load goes up by the increment for that equipment type. ';
  h += 'If the jump would exceed 5 percent of the load, it asks for a rep instead. ';
  h += 'Miss the bottom of the range twice at the same weight and the stall counter starts. ';
  h += 'Three straight sessions flat and it flags a swap. Two main lifts flat in a week and it flags a deload.';
  h += '</div>';
  return h;
}

/* ---------- actions ---------- */
function logSet(day, exId){
  var w = weekNo();
  var t = templateFor(day, w);
  var e = t.ex.filter(function(x){ return x.ex===exId; })[0];
  if(!e) return;
  var d = DRAFT[exId] || {w:0, reps:e.lo};
  var s = sessionFor(day);
  S.sets.push({id:uid(), sid:s.id, ex:exId, weight:Number(d.w)||0, reps:Number(d.reps)||e.lo,
               rir:e.rir, warm:0, ts:Date.now()});
  save();
  startRest(e.rest);
  render();
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}
var rest={left:0,t:null,total:0};
function startRest(sec){
  rest.left=sec; rest.total=sec;
  if(rest.t) clearInterval(rest.t);
  rest.t = setInterval(function(){
    rest.left--;
    if(rest.left<=0){ clearInterval(rest.t); rest.t=null; rest.left=0; }
    paintRest();
  },1000);
  paintRest();
}
function paintRest(){
  var el = document.getElementById('restbar');
  if(!rest.t || rest.left<=0){ el.classList.remove('on'); return; }
  el.classList.add('on');
  var m=Math.floor(rest.left/60), s=rest.left%60;
  document.getElementById('restnum').textContent = m+':'+pad(s);
  var fill = document.getElementById('restfill');
  if(fill && rest.total){ fill.style.width = Math.max(0, Math.min(100, rest.left/rest.total*100)) + '%'; }
}

/* typing a weight or rep writes straight into the draft, no re-render, so focus is kept */
document.addEventListener('input', function(ev){
  var el = ev.target;
  if(!el || !el.classList || !el.classList.contains('winput')) return;
  var ex = el.dataset.ex;
  var f = el.dataset.field || 'w';
  var v = el.value==='' ? 0 : Number(el.value);
  if(!DRAFT[ex]) DRAFT[ex] = {w:0, reps:1, edited:true};
  DRAFT[ex][f] = isFinite(v) ? v : 0;
  DRAFT[ex].edited = true;
});

document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]');
  if(!b) return;
  var a = b.dataset.act, ex = b.dataset.ex;

  if(a==='day'){ VIEWDAY = Number(b.dataset.day); DRAFT={}; render(); return; }
  if(a==='w-'||a==='w+'||a==='r-'||a==='r+'){
    var w = weekNo();
    var e = templateFor(VIEWDAY,w).ex.filter(function(x){ return x.ex===ex; })[0];
    var sg = suggest(e,w);
    var d = draft(e,sg);
    var inc = incFor(ex);
    if(a==='w-') d.w = Math.max(0, (Number(d.w)||0) - inc);
    if(a==='w+') d.w = (Number(d.w)||0) + inc;
    if(a==='r-') d.reps = Math.max(1, (Number(d.reps)||1) - (e.secs?5:1));
    if(a==='r+') d.reps = (Number(d.reps)||1) + (e.secs?5:1);
    d.edited = true;
    render(); return;
  }
  if(a==='log'){ logSet(Number(b.dataset.day), ex); return; }
  if(a==='del'){
    var goneId = b.dataset.id;
    S.deleted.sets.push(goneId);
    S.sets = S.sets.filter(function(x){ return x.id!==goneId; });
    save(); render(); return;
  }
  if(a==='finish'){
    var day = Number(b.dataset.day);
    var s = sessionFor(day);
    var n = setsFor(s.id).length;
    toast(n? 'Session saved: '+n+' sets' : 'Nothing logged yet');
    VIEWDAY = (day%6)+1; DRAFT={}; render(); return;
  }
  if(a==='restskip'){ if(rest.t) clearInterval(rest.t); rest.t=null; rest.left=0; paintRest(); return; }
  if(a==='savebw'){
    var wv = document.getElementById('bw').value;
    var wa = document.getElementById('bwaist').value;
    if(!wv){ toast('Enter a weight'); return; }
    var t2 = todayStr();
    S.body = S.body.filter(function(r){ return r.date!==t2; });
    S.body.push({date:t2, weight:Number(wv), waist: wa?Number(wa):null, ts:Date.now()});
    save(); render(); return;
  }
  if(a==='savestart'){
    var v = document.getElementById('startdate').value;
    if(v){ S.start = v; save(); render(); toast('Start date saved'); }
    return;
  }
  if(a==='gentoken'){ document.getElementById('syncToken').value = genToken(); return; }
  if(a==='savesync'){
    SYNC.url = document.getElementById('syncUrl').value.trim().replace(/\/+$/,'');
    SYNC.key = document.getElementById('syncKey').value.trim();
    SYNC.token = document.getElementById('syncToken').value.trim();
    if(SYNC.token && SYNC.token.length<24){ toast('Use at least 24 characters for the token'); return; }
    saveSync(); render();
    if(syncConfigured()) syncNow(true);
    else toast('Fill in all three fields');
    return;
  }
  if(a==='syncnow'){ syncNow(true); return; }
  if(a==='syncdisconnect'){ SYNC={}; saveSync(); render(); toast('Sync disconnected'); return; }
  if(a==='export'){
    var blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href=url; link.download='cb-12-weeks-'+todayStr()+'.json';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    return;
  }
  if(a==='import'){ document.getElementById('impfile').click(); return; }
  if(a==='wipe'){
    if(confirm('Erase all data for CB 12 Weeks Program on this device? Export first. Sync will be disconnected so this does not wipe the other device.')){
      SYNC = {}; saveSync();
      S = defState(); save(true); DRAFT={}; TAB='today'; render(); toast('Erased');
    }
    return;
  }
});

document.addEventListener('change', function(ev){
  var el = ev.target;
  if(el.dataset.act==='pickex'){ PROGEX = el.value; render(); }
  if(el.dataset.act==='inc'){
    var id = el.dataset.ex;
    var v = Number(el.value);
    if(v>0) S.settings.inc[id]=v; else delete S.settings.inc[id];
    save();
  }
  if(el.id==='impfile'){
    var f = el.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var o = JSON.parse(rd.result);
        if(!o || !o.sessions) throw new Error('bad file');
        S = o; if(!S.settings) S.settings={inc:{},unit:'lb'};
        save(); DRAFT={}; render(); toast('Imported');
      }catch(e){ toast('That file is not a CB 12 Weeks Program export'); }
    };
    rd.readAsText(f);
  }
});

document.querySelectorAll('nav button').forEach(function(b){
  b.addEventListener('click', function(){ TAB = b.dataset.tab; render(); });
});

/* ---------- self test (open index.html?selftest) ---------- */
function selfTest(){
  var res = [];
  function ok(name, cond){ res.push((cond?'PASS ':'FAIL ')+name); }
  var snap = JSON.stringify(S);
  try{
    ok('6 templates', PROG.length===6);
    ok('push A base has 9 entries', templateFor(1,1).ex.length===9);
    ok('week 5 rotates press and lateral raise',
       templateFor(1,5).ex.some(function(e){ return e.ex==='machpress'; }) &&
       templateFor(1,5).ex.some(function(e){ return e.ex==='cablelat'; }));
    ok('no duplicate exercises inside a session',
       [1,5,9].every(function(wk){
         return [1,2,3,4,5,6].every(function(d){
           var ids = templateFor(d,wk).ex.map(function(e){ return e.ex; });
           return ids.length === ids.filter(function(v,i,a){ return a.indexOf(v)===i; }).length;
         });
       }));
    ok('week 9 rotates incline db to incline barbell',
       templateFor(1,9).ex.some(function(e){ return e.ex==='incbb'; }));
    ok('week 8 halves sets', templateFor(1,8).ex[1].sets===2);
    ok('week 4 is 60 percent', templateFor(1,4).ex[1].sets===2);

    S.sets = [];
    var e = {ex:'bbbench', sets:4, lo:4, hi:6, rest:150, rir:2};
    var s1 = suggest(e, 1);
    ok('seed load used with no history', s1.w===115 && s1.reps===4);

    S.sets = [{id:'a', sid:'s1', ex:'bbbench', weight:115, reps:6, rir:2, ts:1}];
    var s2 = suggest(e, 1);
    ok('top of range adds 5 lb', s2.w===120 && s2.reps===4);

    S.sets = [{id:'a', sid:'s1', ex:'bbbench', weight:115, reps:4, rir:2, ts:1}];
    var s3 = suggest(e, 1);
    ok('mid range adds a rep', s3.w===115 && s3.reps===5);

    S.sets = [{id:'a', sid:'s1', ex:'bbbench', weight:115, reps:6, rir:2, ts:1},
              {id:'b', sid:'s2', ex:'bbbench', weight:120, reps:4, rir:2, ts:2},
              {id:'c', sid:'s3', ex:'bbbench', weight:120, reps:4, rir:2, ts:3},
              {id:'d', sid:'s4', ex:'bbbench', weight:120, reps:4, rir:2, ts:4}];
    ok('stall counter counts flat sessions', stallCount('bbbench')>=2);

    S.sets = [{id:'a', sid:'s1', ex:'incdb', weight:80, reps:10, rir:2, ts:1}];
    var s4 = suggest({ex:'incdb', sets:3, lo:8, hi:10, rest:120, rir:2}, 1);
    ok('big jump becomes a rep push', s4.w===80 && s4.reps===11);

    S.sets = [{id:'a', sid:'s1', ex:'squat', weight:115, reps:6, rir:2, ts:1}];
    var s5 = suggest({ex:'squat', sets:4, lo:4, hi:6, rest:180, rir:2}, 1);
    ok('lower body adds 10 lb', s5.w===125);

    ok('bodyweight increments correctly', e1rm(100,5,0)>100);

    S.body = [{date:'2026-01-01', weight:185},{date:'2026-01-08', weight:184},{date:'2026-01-15', weight:183}];
    var tr = bodyTrend();
    ok('weight trend is negative', tr && tr.slope < -0.1);

    ok('alerts returns array', Array.isArray(alerts()));
    ok('muscle volume text builds', muscleVolume().length>100);
  }catch(err){
    res.push('FAIL threw: '+err.message);
  }
  S = JSON.parse(snap);
  document.body.dataset.test = res.join(' | ');
  document.title = res.filter(function(r){ return r.indexOf('FAIL')===0; }).length ? 'TESTS FAILED' : 'ALL TESTS PASS';
}
if(location.search.indexOf('selftest')>=0) selfTest();

    q('nav button[data-tab="today"]').click();

/* ---------- sync test (open index.html?synctest) ---------- */
function syncTest(){
  var res=[];
  function ok(n,c){ res.push((c?'PASS ':'FAIL ')+n); }
  var snap = JSON.stringify(S), ssnap = JSON.stringify(SYNC);
  try{
    S.sets = [{id:'old1', sid:'s1', ex:'bbbench', weight:100, reps:5, rir:2, ts:1}];
    S.sessions = [];
    S.body = [{date:'2026-01-01', weight:180, ts:5}];
    S.deleted = {sets:[], sessions:[]};

    var changed = mergeRemote({
      v:1,
      sessions:[{id:'s9', date:'2026-01-02', day:2, week:1, ts:50}],
      sets:[
        {id:'r1', sid:'s9', ex:'bbbench', weight:130, reps:5, rir:2, ts:99},
        {id:'old1', sid:'s1', ex:'bbbench', weight:100, reps:5, rir:2, ts:1}
      ],
      body:[
        {date:'2026-01-01', weight:179, ts:60},
        {date:'2026-01-08', weight:178, ts:70}
      ],
      deleted:{sets:['old1'], sessions:[]}
    });
    ok('merge reports a change', changed===true);
    ok('remote set arrives', S.sets.some(function(x){ return x.id==='r1'; }));
    ok('remote session arrives', S.sessions.some(function(x){ return x.id==='s9'; }));
    ok('tombstone removes a local set', !S.sets.some(function(x){ return x.id==='old1'; }));
    ok('newer body record wins', S.body.filter(function(x){ return x.date==='2026-01-01'; })[0].weight===179);
    ok('new body date appended', S.body.some(function(x){ return x.date==='2026-01-08'; }));
    ok('body stays sorted', S.body[0].date < S.body[S.body.length-1].date);

    S.sets = [{id:'x1', sid:'s1', ex:'squat', weight:115, reps:5, rir:2, ts:10}];
    S.deleted = {sets:['y1'], sessions:[]};
    S.sessions = [{id:'s1', date:'2026-01-03', day:3, week:1, ts:10}];
    mergeRemote({v:1, sessions:[], sets:[], body:[], deleted:{sets:[], sessions:[]}});
    ok('local data survives an empty remote', S.sets.length===1 && S.sessions.length===1);
    ok('tombstones survive a merge', S.deleted.sets.indexOf('y1')>=0);

    SYNC = {url:'https://demo.supabase.co', key:'anonkey', token:'0123456789abcdef0123456789abcdef'};
    var calls = [];
    window.fetch = function(u, o){
      calls.push(String(u));
      var isPull = String(u).indexOf('pull_state')>=0;
      var body = isPull ? {v:1, sessions:[], sets:[], body:[], deleted:{sets:[],sessions:[]}} : {ok:true};
      return Promise.resolve({ ok:true, json:function(){ return Promise.resolve(body); } });
    };
    syncNow(true).then(function(done){
      ok('sync calls pull then push', calls.length===2 &&
         calls[0].indexOf('pull_state')>0 && calls[1].indexOf('push_state')>0);
      ok('sync reports success', done===true);
      ok('sync status is ok', SYNC.status==='ok');
      window.fetch = function(){ return Promise.reject(new Error('offline')); };
      return syncNow(true).then(function(failed){
        ok('network failure is handled', failed===false && SYNC.status.indexOf('error')===0);
      });
    }).then(function(){
      S = JSON.parse(snap); SYNC = JSON.parse(ssnap); saveSync();
      document.body.dataset.test = res.join(' | ');
      document.title = res.filter(function(r){ return r.indexOf('FAIL')===0; }).length ? 'SYNC TESTS FAILED' : 'SYNC TESTS PASS';
    }).catch(function(e){
      res.push('FAIL threw '+e.message);
      document.body.dataset.test = res.join(' | ');
      document.title = 'SYNC TESTS FAILED';
    });
  }catch(e){
    res.push('FAIL threw '+e.message);
    document.body.dataset.test = res.join(' | ');
    document.title = 'SYNC TESTS FAILED';
  }
}
